name: Build FDE Manager（三平台安装包）

# 每次推 tag（如 v7.26.3）或手动触发时，在三个系统上各出一份安装包。
# 推 tag 时：三平台构建完成后，release job 自动把安装包提成正式 GitHub Release，
# 用户可以直接到 Releases 页下载，不用进 Actions 找 Artifact。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13/macos-14 标签已排队 24h 或不支持；macos-latest（arm）一台打两种架构，
        # electron-builder 在 arm 机器上交叉打 x64 包没问题（未签名，无需真机）
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Windows 默认用 PowerShell，统一成 bash，方便 tee 日志
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 图标已随仓库提交（build/icon.* 与 build/icons/），CI 无需再生成
      - name: 安装依赖
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ci-log-npm.txt

      # 国内网络/CI 偶发下载慢：走 npmmirror（国际 CI 也能访问）
      - name: 打包
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          set -o pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx electron-builder --mac dmg zip --x64 --arm64 --publish never 2>&1 | tee ci-log-build.txt
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npx electron-builder --linux AppImage deb --x64 --publish never 2>&1 | tee ci-log-build.txt
          else
            npx electron-builder --win nsis portable --x64 --publish never 2>&1 | tee ci-log-build.txt
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: FDE-Manager-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

      # 失败时日志以 Artifact 公开可下载（匿名 API 拉不了 job 日志，但能拉公开 Artifact）
      - name: 上传日志（失败排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDE-Manager-logs-${{ matrix.os }}
          path: ci-log-*.txt
          if-no-files-found: ignore

  # 推 tag 时把三平台安装包提成正式 Release（普通 master 构建/手动触发不出 Release）
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 汇总下载三平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: FDE-Manager-windows-latest
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: FDE-Manager-macos-latest
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: FDE-Manager-ubuntu-latest
          merge-multiple: true
          path: dist

      - name: 清单
        run: ls -la dist/

      - name: 创建/更新 GitHub Release 并上传安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 没有 checkout（不需要源码），gh 靠 GH_REPO 定位仓库
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          # 未签名软件最需要的校验值文件
          ( cd dist && sha256sum * > checksums.txt )
          cat dist/checksums.txt
          # Release 正文：docs/release/<tag>.md 存在则用，否则回退自动生成
          NOTES="docs/release/$TAG.md"
          if [ -f "$NOTES" ]; then NOTE_ARGS=(--notes-file "$NOTES"); else NOTE_ARGS=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 命名规则变更后旧资产会残留，先清掉再重传
            gh release view "$TAG" --json assets --jq '.assets[].name' | \
              xargs -r -n1 -I'{}' gh release delete-asset "$TAG" '{}' --yes
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "FDE Manager $TAG" "${NOTE_ARGS[@]}"
          else
            gh release create "$TAG" dist/* \
              --title "FDE Manager $TAG" "${NOTE_ARGS[@]}"
          fi 2>&1 | tee release-log.txt
          exit ${PIPESTATUS[0]}

      # release 步骤的输出存成公开 Artifact，匿名可查（job 日志需要 admin 权限）
      - name: 上传 release 日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDE-Manager-release-log
          path: release-log.txt
          if-no-files-found: ignore
