name: Build FDE Manager（三平台安装包）

# 每次推 tag（如 v7.26.0）或手动触发时，在三个系统上各出一份安装包。
# 产物在 Actions 页面的 Artifacts 里下载：
#   Windows : FDE-Manager-<版本>-setup-x64.exe / portable
#   macOS   : dmg + zip（Intel x64 与 Apple M 系列 arm64）
#   Linux   : AppImage + deb
#
# 注意：--publish never —— 否则推 tag 时 electron-builder 会自动进入发布模式，
# 没有 GH_TOKEN 直接 exit 1（2026-11-22 三平台全挂的原因）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-13/macos-14 标签已排队 24h 或不支持；macos-latest（arm）一台打两种架构，
        # electron-builder 在 arm 机器上交叉打 x64 包没问题（未签名，无需真机）
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 图标已随仓库提交（build/icon.* 与 build/icons/），CI 无需再生成
      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      # 国内网络/CI 偶发下载慢：走 npmmirror（国际 CI 也能访问）
      - name: 打包
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            npx electron-builder --mac dmg zip --x64 --arm64 --publish never
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npx electron-builder --linux AppImage deb --x64 --publish never
          else
            npx electron-builder --win nsis portable --x64 --publish never
          fi

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: FDE-Manager-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
